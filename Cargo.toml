[package]
name = "omnitop"
version = "0.2.0"
edition = "2021"
description = "A unified system monitor: processes, containers, GPU, and network in one TUI"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
