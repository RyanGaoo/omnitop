[package]
name = "omnitop"
version = "0.5.0"
edition = "2021"
description = "A unified system monitor: processes, containers, GPU, and network in one TUI"
license = "MIT"
repository = "https://github.com/RyanGaoo/omnitop"
homepage = "https://github.com/RyanGaoo/omnitop"
readme = "README.md"
keywords = ["tui", "monitor", "htop", "system", "cli"]
categories = ["command-line-utilities", "visualization"]
exclude = ["docs/", "*.tape"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Process termination on Windows (no POSIX signals there): OpenProcess + TerminateProcess.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

# NVIDIA GPU stats on Linux/Windows. nvml-wrapper loads libnvidia-ml at runtime, so it
# links cleanly even on machines without an NVIDIA driver (it just no-ops there).
[target.'cfg(not(target_os = "macos"))'.dependencies]
nvml-wrapper = "0.10"

[profile.release]
lto = true
strip = true
