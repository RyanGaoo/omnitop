[package]
name = "omnitop"
version = "0.3.0"
edition = "2021"
description = "A unified system monitor: processes, containers, GPU, and network in one TUI"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
